[package]
name = "sn-crypto"
description = "Handshake transcript, key schedule, AEAD framing and PASETO session tokens (mirrors backend/internal/protocol)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
hkdf = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[dev-dependencies]
p256 = { version = "0.14.0", features = ["ecdsa"] }
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
sn-proto = { path = "../sn-proto" }
