[package]
name = "carthago-sched"
description = "Budgeted, resumable-slice scan scheduler (architecture plan §3.4, G2 budgets)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Kernel", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
