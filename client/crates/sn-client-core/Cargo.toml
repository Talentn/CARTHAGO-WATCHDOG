[package]
name = "sn-client-core"
description = "Client SDK runtime: device identity, gateway session (handshake, heartbeats), scan scheduler wiring"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ed25519-dalek = "3.0.0"
hex = "0.4.3"
prost = "0.14.4"
sha2 = "0.11.1"
sn-attest = { path = "../sn-attest" }
sn-crypto = { path = "../sn-crypto" }
sn-proto = { path = "../sn-proto" }
sn-sched = { path = "../sn-sched" }
thiserror = "2.0.21"
tungstenite = "0.30.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security_Cryptography", "Win32_System_Diagnostics_Debug", "Win32_System_LibraryLoader"] }
