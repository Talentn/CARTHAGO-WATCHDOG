[package]
name = "carthago-net"
description = "Carthago Watchdog gateway transport: synchronous WebSocket over TLS 1.3 with server public-key (SPKI) pinning"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hex = "0.4.3"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tungstenite = "0.30.0"

[dev-dependencies]
rcgen = "0.14.10"
