// Game server <-> gateway control channel (carthago-server). One binary WebSocket message per
// protobuf message on /v1/gs, authenticated with the tenant's server API key.
syntax = "proto3";

package carthago.v1;

option go_package = "carthago/backend/gen/carthago/v1;carthagov1";

message WatchSession {
  string session_id = 1; // hex, from a verified session token
}

message UnwatchSession {
  string session_id = 1;
}

message GsClientMsg {
  oneof body {
    WatchSession watch = 1;
    UnwatchSession unwatch = 2;
  }
}

message Kick {
  string session_id = 1;
  string reason = 2; // e.g. "heartbeat_timeout"
  uint64 at_ms = 3;
  string player_hash = 4;
}

message WatchAck {
  string session_id = 1;
  bool known = 2;
}

message GsServerMsg {
  oneof body {
    Kick kick = 1;
    WatchAck watch_ack = 2;
  }
}

// Authoritative gameplay telemetry (plan §2 data path 2 and §6.1). A game server streams
// GameplayBatch frames over a second WebSocket, /v1/ingest, authenticated with the same
// server API key; the gateway answers each with an IngestAck. Players are addressed by a
// per-match slot so per-tick samples stay small.

message MatchPlayer {
  uint32 slot = 1;
  string session_id = 2; // hex, from the verified session token ("" for unprotected bots)
  string player_hash = 3;
  int32 mmr = 4; // the studio's skill rating; 0 = unknown
  // v2. Players with the same non-zero team share what they see and hear; 0 = no team (solo).
  uint32 team = 5;
  InputDevice input_device = 6;
  bool aim_assist = 7; // the game applies aim assistance to this player
}

// View angles in degrees for consecutive ticks starting at first_tick.
message AimTrack {
  uint32 slot = 1;
  uint32 first_tick = 2;
  repeated float yaw = 3;
  repeated float pitch = 4;
}

message ShotEvent {
  uint32 slot = 1;
  uint32 tick = 2;
  int32 target_slot = 3; // -1 = no player hit
  bool hit = 4;
  bool headshot = 5;
  bool kill = 6;
  string weapon = 7;
  float distance_m = 8;
}

// Server visibility-trace transitions: target became visible (or hidden) to observer.
message VisibilityEvent {
  uint32 observer_slot = 1;
  uint32 target_slot = 2;
  uint32 tick = 3;
  bool visible = 4;
}

// User commands the server received from a player over [tick_from, tick_to).
message CommandWindow {
  uint32 slot = 1;
  uint32 tick_from = 2;
  uint32 tick_to = 3;
  uint32 commands = 4;
}

// Client-side timestamps of trigger presses of semi-automatic fire, as carried in the
// player's user commands (microseconds, any epoch). Full-auto weapons are excluded because
// their cadence is set by the weapon, not the player.
message TriggerPresses {
  uint32 slot = 1;
  repeated uint64 client_time_us = 2;
}

// ---- Telemetry v2 (Phase 2) ----
// v2 adds what the server needs to work out what each player could legitimately know:
// positions and velocity, sounds with their audible radius, team-shared information, the
// input device class, and a reference to versioned map geometry. A v1 game server leaves every
// v2 field empty and keeps working; schema_version = 2 marks a v2 sender.
//
// Units and axes: map coordinates in centimetres with Z up. View angles (AimTrack) are degrees:
// yaw 0 looks along +X and 90 along +Y; pitch is positive looking up.

enum InputDevice {
  INPUT_DEVICE_UNSPECIFIED = 0;
  INPUT_DEVICE_MOUSE_KEYBOARD = 1;
  INPUT_DEVICE_CONTROLLER = 2;
  INPUT_DEVICE_TOUCH = 3;
}

// Selects the calibration segment the server-side models use.
enum GameMode {
  GAME_MODE_UNSPECIFIED = 0;
  GAME_MODE_COMPETITIVE_SHOOTER = 1;
  GAME_MODE_EXTRACTION = 2;
}

// Eye positions and velocities sampled every `stride` ticks from first_tick. In each repeated
// field the first value is absolute and every later one is the difference from the previous
// sample (zigzag varints), so a running player costs about one byte per axis per sample.
message MotionTrack {
  uint32 slot = 1;
  uint32 first_tick = 2;
  uint32 stride = 3; // 0 is read as 1
  repeated sint32 x_cm = 4;
  repeated sint32 y_cm = 5;
  repeated sint32 z_cm = 6;
  repeated sint32 vx_cm_s = 7;
  repeated sint32 vy_cm_s = 8;
  repeated sint32 vz_cm_s = 9;
}

enum SoundKind {
  SOUND_KIND_UNSPECIFIED = 0;
  SOUND_KIND_FOOTSTEP = 1;
  SOUND_KIND_GUNSHOT = 2;
  SOUND_KIND_RELOAD = 3;
  SOUND_KIND_ABILITY = 4;
  SOUND_KIND_INTERACT = 5; // doors, looting, equipment
}

// A sound the game played. radius_cm is the game's own audibility rule for it: anyone within
// the radius could hear it, walls or not.
message SoundEvent {
  uint32 tick = 1;
  int32 source_slot = 2; // -1 = not a player
  SoundKind kind = 3;
  sint32 x_cm = 4;
  sint32 y_cm = 5;
  sint32 z_cm = 6;
  uint32 radius_cm = 7;
}

enum TeamInfoKind {
  TEAM_INFO_KIND_UNSPECIFIED = 0;
  TEAM_INFO_KIND_PING = 1;    // a teammate marked a location or an item
  TEAM_INFO_KIND_SPOTTED = 2; // the game marked an enemy for the team
  TEAM_INFO_KIND_RADAR = 3;   // a scan or recon ability revealed an enemy
}

// Information the game gave a whole team.
message TeamInfo {
  uint32 tick = 1;
  uint32 team = 2;
  TeamInfoKind kind = 3;
  int32 source_slot = 4; // the teammate who shared it; -1 = the game
  int32 target_slot = 5; // the enemy revealed; -1 = a location
  uint32 item_id = 6;    // the item pinged; 0 = none
  sint32 x_cm = 7;
  sint32 y_cm = 8;
  sint32 z_cm = 9;
  uint32 duration_ms = 10;
}

// Loot or objectives whose location matters (extraction games). Sent on spawn, move and pickup.
message ItemEvent {
  uint32 item_id = 1; // non-zero
  uint32 tick = 2;
  sint32 x_cm = 3;
  sint32 y_cm = 4;
  sint32 z_cm = 5;
  uint32 tier = 6; // the game's value tier, higher is more valuable
  bool removed = 7;
}

message MapRef {
  string map_id = 1;
  uint32 version = 2;
}

// A convex polygon in the XY plane (x0, y0, x1, y1, ...; at least three vertices, either
// winding) extruded from z_min_cm to z_max_cm: walls, buildings, large props. Concave shapes
// are sent as several convex pieces.
message Occluder {
  repeated sint32 xy_cm = 1;
  sint32 z_min_cm = 2;
  sint32 z_max_cm = 3;
}

// A named area (callout) used to word explanations; any simple polygon.
message Zone {
  string name = 1;
  repeated sint32 xy_cm = 2;
}

// A place loot can appear. Whether it holds anything this match is sent as ItemEvents.
message LootSpawn {
  uint32 spawn_id = 1;
  sint32 x_cm = 2;
  sint32 y_cm = 3;
  sint32 z_cm = 4;
}

// Simplified visibility geometry of one map version, uploaded by the game server. A version
// is immutable: the gateway refuses different geometry under a (map_id, version) it already
// holds.
message MapGeometry {
  string map_id = 1;
  uint32 version = 2;
  GameMode mode = 3; // the map's default mode
  repeated Occluder occluders = 4;
  repeated Zone zones = 5;
  repeated LootSpawn loot_spawns = 6;
}

message GameplayBatch {
  string match_id = 1;
  uint64 batch_seq = 2; // strictly increasing per match
  uint32 tick_rate = 3;
  repeated MatchPlayer players = 4;
  repeated AimTrack aim = 5;
  repeated ShotEvent shots = 6;
  repeated VisibilityEvent visibility = 7;
  repeated CommandWindow commands = 8;
  repeated TriggerPresses triggers = 9;
  bool match_over = 10;
  // v2
  uint32 schema_version = 11; // 0 or 1 = v1, 2 = v2
  GameMode mode = 12;
  MapRef map = 13;
  MapGeometry map_geometry = 14; // the geometry for `map`, sent with a match's first batch
  repeated MotionTrack motion = 15;
  repeated SoundEvent sounds = 16;
  repeated TeamInfo team_info = 17;
  repeated ItemEvent items = 18;
  uint32 dropped_events = 19; // v2 samples or events the recorder dropped at its per-batch caps
}

message IngestAck {
  string match_id = 1;
  uint64 batch_seq = 2;
  bool accepted = 3;
  string error = 4;
}
