<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Carthago Watchdog</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/carthago-watchdog.svg" type="image/svg+xml">
</head>
<body>
{{if .Tenant}}
<header class="top">
  <a class="brand" href="/"><img src="/static/carthago-watchdog.svg" alt="" width="28" height="28"><span>Carthago <b>Watchdog</b></span></a>
  <nav>
    <a href="/"{{if eq .Nav "overview"}} class="on"{{end}}>Overview</a>
    <a href="/sessions"{{if eq .Nav "sessions"}} class="on"{{end}}>Sessions</a>
    <a href="/players"{{if eq .Nav "players"}} class="on"{{end}}>Players</a>
  </nav>
  <div class="who">
    <span class="tenant"><span class="muted">Studio</span> {{.Tenant}}</span>
    <form method="post" action="/logout"><button type="submit" class="link">Sign out</button></form>
  </div>
</header>
{{end}}
<main{{if .Tenant}} class="wrap"{{end}}>
{{template "content" .}}
</main>
{{if .Tenant}}<footer class="wrap foot">Carthago Watchdog · studio view, read-only apart from reviewer labels · times in UTC</footer>{{end}}
</body>
</html>
